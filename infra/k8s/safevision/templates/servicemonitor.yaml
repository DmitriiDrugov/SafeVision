{{- if .Values.monitoring.serviceMonitor.enabled }}
# Prometheus Operator ServiceMonitor — scrapes /metrics from all services.
# Requires kube-prometheus-stack or prometheus-operator installed in the cluster.

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "safevision.fullname" . }}-ingestion
  namespace: {{ .Values.monitoring.serviceMonitor.namespace }}
  labels:
    {{- include "safevision.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "safevision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
      path: /metrics

