apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "safevision.fullname" . }}-web
  labels:
    {{- include "safevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      {{- include "safevision.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "safevision.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "safevision.image" (dict "root" . "svc" .Values.web) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # These are baked into the Next.js bundle at build time.
            # In production, build images with the correct values embedded,
            # or use runtime config via NEXT_PUBLIC_* server-side rewrites.
            - name: NEXT_PUBLIC_API_URL
              value: "http://{{ include "safevision.fullname" . }}-incident:8004"
            - name: NEXT_PUBLIC_RULES_API_URL
              value: "http://{{ include "safevision.fullname" . }}-rule-engine:8003"
            - name: NEXT_PUBLIC_WS_URL
              value: "ws://{{ include "safevision.fullname" . }}-notification:8005/ws/incidents"
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "safevision.fullname" . }}-secrets
                  key: OPENROUTER_API_KEY
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "safevision.fullname" . }}-web
  labels:
    {{- include "safevision.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  selector:
    {{- include "safevision.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
