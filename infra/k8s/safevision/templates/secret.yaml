apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safevision.fullname" . }}-secrets
  labels:
    {{- include "safevision.labels" . | nindent 4 }}
type: Opaque
data:
  # JWT shared secret — used by both incident and rule-engine
  SECRET_KEY: {{ .Values.auth.secretKey | b64enc | quote }}

  # Comma-separated "username:password:role" entries for the incident service
  AUTH_USERS: {{ .Values.auth.authUsers | b64enc | quote }}

  # PostgreSQL password (used both by the internal StatefulSet and by
  # the DATABASE_URL assembled for application services)
  POSTGRES_PASSWORD: {{ .Values.postgres.password | b64enc | quote }}

  # MinIO / S3 credentials
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | b64enc | quote }}
  MINIO_ACCESS_KEY: {{ include "safevision.minioAccessKey" . | b64enc | quote }}
  MINIO_SECRET_KEY: {{ include "safevision.minioSecretKey" . | b64enc | quote }}

  # OpenRouter API key for the chat-based config UI (may be empty)
  OPENROUTER_API_KEY: {{ .Values.web.openrouterApiKey | b64enc | quote }}
