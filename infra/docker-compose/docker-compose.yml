name: safevision

# ─────────────────────────────────────────────────────────────────────────────
# SafeVision Infrastructure Stack
#
# Boots: PostgreSQL 16 (TimescaleDB), Redis 7, MinIO, n8n,
#        Prometheus, Grafana, Loki, Promtail
#
# Application services (ingestion, inference, rule-engine, incident,
# notification, web) are NOT included here — they will be added in
# subsequent milestones.
#
# Usage:
#   cp .env.example .env          # edit passwords first
#   docker compose up -d
#   docker compose ps             # verify all services are healthy
#
# Note: n8n requires a separate database on the PostgreSQL instance.
#   Run once after first boot:
#   docker exec -it safevision-postgres-1 createdb -U safevision n8n
# ─────────────────────────────────────────────────────────────────────────────

networks:
  safevision_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  prometheus_data:
  grafana_data:
  loki_data:
  n8n_data:
  models_data:    # YOLOv8 ONNX weights; populate via `docker cp` or a model-download init container
  frame_archive:  # JPEG ring-buffer shared between ingestion (writer) and incident (reader)

services:

  # ─── PostgreSQL 16 + TimescaleDB ──────────────────────────────────────────
  postgres:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - safevision_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - safevision_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Web console
    networks:
      - safevision_net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ─── n8n (workflow automation for WhatsApp/email routing) ─────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD}
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - safevision_net
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Prometheus ───────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - safevision_net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Grafana ──────────────────────────────────────────────────────────────
  # Runs on host port 3001 to avoid conflict with the Next.js app on port 3000.
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana_data:/var/lib/grafana
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../infra/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - safevision_net
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Loki (log aggregation) ───────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - safevision_net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── Promtail (log shipper) ───────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - safevision_net
    depends_on:
      loki:
        condition: service_healthy

  # ─── M4: Notification Service ────────────────────────────────────────────
  notification:
    build:
      context: ../..
      dockerfile: services/notification/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      # Configure n8n webhook URLs after setting up workflows in n8n UI:
      N8N_WHATSAPP_WEBHOOK_URL: "${N8N_WHATSAPP_WEBHOOK_URL:-}"
      N8N_EMAIL_WEBHOOK_URL: "${N8N_EMAIL_WEBHOOK_URL:-}"
      METRICS_PORT: "8007"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    ports:
      - "8005:8005"    # FastAPI
      - "8007:8007"    # Prometheus metrics
    networks:
      - safevision_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── M3: Incident Service ────────────────────────────────────────────────
  incident:
    build:
      context: ../..
      dockerfile: services/incident/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET_INCIDENTS: incidents
      FRAME_ARCHIVE_DIR: /data/frame-archive
      METRICS_PORT: "8006"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - frame_archive:/data/frame-archive:ro
    ports:
      - "8004:8004"    # FastAPI REST + WebSocket
      - "8006:8006"    # Prometheus metrics
    networks:
      - safevision_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─── M2: Rule Engine ─────────────────────────────────────────────────────
  rule-engine:
    build:
      context: ../..
      dockerfile: services/rule-engine/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      RULES_DIR: /etc/safevision/rules
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - ./rules:/etc/safevision/rules:rw
    ports:
      - "8003:8003"    # FastAPI (REST + /metrics)
    networks:
      - safevision_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── M1: Ingestion Service ────────────────────────────────────────────────
  ingestion:
    build:
      context: ../..
      dockerfile: services/ingestion/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      # JSON array of Camera objects — override per deployment
      CAMERA_CONFIG: >-
        [{"id":"cam01","name":"Line A","rtsp_url":"${CAM01_RTSP_URL:-rtsp://mediamtx:8554/cam01}","zones":[],"enabled":true}]
      METRICS_PORT: "8001"
      FPS_TARGET: "${FPS_TARGET:-5.0}"
      FRAME_ARCHIVE_DIR: /data/frame-archive
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - frame_archive:/data/frame-archive
    ports:
      - "8001:8001"    # Prometheus metrics
    networks:
      - safevision_net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import ingestion; print('ok')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─── M1: Inference Service ────────────────────────────────────────────────
  # GPU passthrough: uncomment the `deploy` block and set DEVICE=cuda
  inference:
    build:
      context: ../..
      dockerfile: services/inference/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      MODEL_PATH: /models/yolov8n-ppe.onnx
      DEVICE: "${INFERENCE_DEVICE:-cpu}"
      METRICS_PORT: "8002"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
    volumes:
      - models_data:/models
    ports:
      - "8002:8002"    # Prometheus metrics
    networks:
      - safevision_net
    depends_on:
      redis:
        condition: service_healthy
    # Uncomment to enable NVIDIA GPU passthrough:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ─── M5: Web / Config UI ─────────────────────────────────────────────────
  web:
    build:
      context: ../..
      dockerfile: web/app/Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: "http://incident:8004"
      NEXT_PUBLIC_RULES_API_URL: "http://rule-engine:8003"
      NEXT_PUBLIC_WS_URL: "ws://notification:8005/ws/incidents"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
    ports:
      - "3000:3000"
    networks:
      - safevision_net
    depends_on:
      - incident
      - rule-engine
      - notification
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
