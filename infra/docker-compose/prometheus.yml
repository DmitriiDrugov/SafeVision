global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Add AlertManager when deployed: ['alertmanager:9093']

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ─── Infrastructure ───────────────────────────────────────────────────────

  - job_name: ingestion
    static_configs:
      - targets: ["ingestion:8001"]

  - job_name: inference
    static_configs:
      - targets: ["inference:8002"]

  - job_name: rule-engine
    static_configs:
      - targets: ["rule-engine:8003"]

  - job_name: incident
    metrics_path: /metrics
    static_configs:
      - targets: ["incident:8006"]

  - job_name: notification
    metrics_path: /metrics
    static_configs:
      - targets: ["notification:8007"]

  # ─── MinIO metrics ────────────────────────────────────────────────────────
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
