[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevision-proto"
version = "0.1.0"
description = "SafeVision Redis Stream event payload models"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["proto"]
