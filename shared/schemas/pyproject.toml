[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevision-schemas"
version = "0.1.0"
description = "SafeVision shared Pydantic v2 data models"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["schemas"]
