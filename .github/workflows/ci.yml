name: CI

on:
  push:
    branches: ["main", "claude/**", "feature/**"]
  pull_request:
    branches: ["main"]

jobs:

  # ── Python linting ────────────────────────────────────────────────────────

  lint-python:
    name: Lint Python (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint tools and shared packages
        run: |
          pip install ruff mypy pydantic
          pip install -e shared/schemas
          pip install -e shared/proto
      - name: ruff check
        run: ruff check shared/ services/
      - name: mypy (shared only)
        run: |
          mypy shared/schemas/schemas/ shared/proto/proto/ \
            --ignore-missing-imports \
            --no-strict-optional

  # ── Web linting ───────────────────────────────────────────────────────────

  lint-web:
    name: Lint Web (eslint + prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/app/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: web/app
      - name: eslint
        run: npm run lint
        working-directory: web/app
      - name: prettier check
        run: npm run format:check
        working-directory: web/app

  # ── Python unit tests (per service) ──────────────────────────────────────

  test-unit:
    name: Unit Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingestion, inference, rule-engine, incident]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared packages
        run: |
          pip install -e shared/schemas
          pip install -e shared/proto
      - name: Install service with dev extras
        run: pip install -e "services/${{ matrix.service }}[dev]"
      - name: pytest
        run: |
          pytest services/${{ matrix.service }}/tests/ \
            -v --tb=short \
            --asyncio-mode=auto

  # ── Python integration tests ──────────────────────────────────────────────

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install shared packages and integration test deps
        run: |
          pip install -e shared/schemas
          pip install -e shared/proto
          pip install -e "services/rule-engine[dev]"
          pip install -e "services/incident[dev]"
          pip install \
            pytest pytest-asyncio \
            "redis[hiredis]>=5.0" \
            pydantic structlog watchdog prometheus-client \
            pyyaml httpx aiosqlite sqlalchemy
      - name: pytest integration
        run: |
          pytest tests/integration/ \
            -v --tb=short \
            --asyncio-mode=auto
        env:
          REDIS_URL: redis://localhost:6379
          SECRET_KEY: ci-integration-test-secret-key

  # ── Web unit tests ────────────────────────────────────────────────────────

  test-web:
    name: Unit Tests (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/app/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: web/app
      - name: vitest
        run: npm run test
        working-directory: web/app

  # ── Playwright E2E tests ──────────────────────────────────────────────────

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/app/package-lock.json
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        working-directory: web/app
      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps
        working-directory: web/app
      - name: Build Next.js app
        run: npm run build
        working-directory: web/app
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_API_URL: ""
      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: web/app
        env:
          CI: "true"
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7

  # ── Docker image builds ────────────────────────────────────────────────────

  build-images:
    name: Build Docker Image (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [lint-python, lint-web, test-unit, test-integration, test-web, test-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ingestion
            context: .
            dockerfile: services/ingestion/Dockerfile
          - service: inference
            context: .
            dockerfile: services/inference/Dockerfile
          - service: rule-engine
            context: .
            dockerfile: services/rule-engine/Dockerfile
          - service: incident
            context: .
            dockerfile: services/incident/Dockerfile
          - service: web
            # web/app/Dockerfile expects its own folder as the build context
            # (it COPYs package.json and .npmrc relative to ./).
            context: web/app
            dockerfile: web/app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ghcr.io/dmitriidrugov/safevision/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
