[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevision-notification"
version = "0.1.0"
description = "SafeVision Notification Service — routes alerts to n8n webhooks"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "redis[hiredis]>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp>=1.23",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "safevision-schemas @ file://../../shared/schemas",
    "safevision-proto @ file://../../shared/proto",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]
