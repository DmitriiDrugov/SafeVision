# Alembic configuration for SafeVision Incident Service.
#
# Usage (from services/incident/):
#   alembic upgrade head                  # apply all pending migrations
#   alembic downgrade -1                  # roll back one migration
#   alembic revision --autogenerate -m "describe change"  # generate new migration
#   alembic current                       # show current DB revision
#   alembic history                       # list all revisions
#
# DATABASE_URL must be set in the environment (same var used by the service).

[alembic]
script_location = src/incident/db/migrations

# DATABASE_URL is read from the environment in env.py — no need to set it here.
# sqlalchemy.url is intentionally left blank.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
