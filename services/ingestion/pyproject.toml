[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safevision-ingestion"
version = "0.1.0"
description = "SafeVision Ingestion Service — RTSP stream reader and frame publisher"
requires-python = ">=3.11"
dependencies = [
    "av>=12.0",
    "opencv-python-headless>=4.9",
    "redis[hiredis]>=5.0",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.23",
    "opentelemetry-exporter-otlp>=1.23",
    "pydantic>=2.0",
    "safevision-schemas @ file://../../shared/schemas",
    "safevision-proto @ file://../../shared/proto",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-mock>=3.12"]

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]
